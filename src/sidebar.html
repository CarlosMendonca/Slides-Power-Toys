<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8f9fa;
      --border: #dadce0;
      --text: #202124;
      --muted: #5f6368;
      --accent: #1a73e8;
      --accent-hover: #1557b0;
      --accent-soft: #e8f0fe;
      --ok-bg: #e6f4ea;
      --ok-text: #137333;
      --err-bg: #fce8e6;
      --err-text: #c5221f;
      --radius: 6px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Google Sans', Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 8px;
      border: none;
      background: transparent;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }

    .tab-btn:hover { color: var(--text); background: var(--surface); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .panel { display: none; flex-direction: column; gap: 10px; }
    .panel.active { display: flex; }

    .card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 9px;
      background: var(--bg);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 7px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--muted);
    }

    .hint {
      font-size: 10px;
      color: var(--muted);
    }

    .row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 6px;
    }

    .row:last-child { margin-bottom: 0; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .grid-6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }

    button.btn {
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      color: var(--text);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    button.btn:hover:not(:disabled) {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    button.btn:active:not(:disabled) { transform: translateY(0.5px); }
    button.btn:disabled { opacity: 0.5; cursor: not-allowed; }

    button.btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      color: #fff;
    }

    button.btn-sm { padding: 4px 5px; font-size: 11px; }

    .segmented {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 7px;
    }

    .segmented button {
      flex: 1;
      border: none;
      padding: 5px 6px;
      font-size: 11px;
      font-weight: 500;
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
    }

    .segmented button.active {
      background: var(--accent);
      color: #fff;
    }

    select, input[type="number"] {
      padding: 4px 6px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 11px;
      color: var(--text);
      background: var(--bg);
    }

    input[type="number"] { width: 64px; }
    input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }

    .hue-slider {
      -webkit-appearance: none;
      appearance: none;
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(
        to right,
        hsl(0, 100%, 50%),
        hsl(60, 100%, 50%),
        hsl(120, 100%, 50%),
        hsl(180, 100%, 50%),
        hsl(240, 100%, 50%),
        hsl(300, 100%, 50%),
        hsl(360, 100%, 50%)
      );
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--text);
      cursor: pointer;
    }

    .swatch-box {
      width: 34px;
      height: 34px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background-image:
        linear-gradient(45deg, #ccc 25%, transparent 25%),
        linear-gradient(-45deg, #ccc 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #ccc 75%),
        linear-gradient(-45deg, transparent 75%, #ccc 75%);
      background-size: 10px 10px;
      background-position: 0 0, 0 5px, 5px -5px, -5px 0;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .swatch-fill { position: absolute; inset: 0; }

    .color-meta { flex: 1; min-width: 0; line-height: 1.35; }
    .color-hex { font-weight: 700; font-size: 12px; font-family: ui-monospace, monospace; }
    .color-details { font-size: 10.5px; color: var(--muted); font-family: ui-monospace, monospace; }

    .theme-badge {
      display: inline-block;
      margin-top: 3px;
      padding: 1px 5px;
      font-size: 10px;
      border-radius: 3px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }

    .hue-swatches {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 3px;
      margin-top: 6px;
    }

    .hue-dot {
      height: 16px;
      border-radius: 3px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      cursor: pointer;
      padding: 0;
    }

    .hue-dot:hover { transform: scale(1.12); }

    .val-label {
      min-width: 34px;
      text-align: right;
      font-size: 11px;
      font-family: ui-monospace, monospace;
      color: var(--muted);
    }

    .status-bar {
      border-top: 1px solid var(--border);
      padding: 7px 10px;
      font-size: 11px;
      color: var(--muted);
      background: var(--surface);
      min-height: 30px;
      display: flex;
      align-items: center;
    }

    .status-bar.ok { background: var(--ok-bg); color: var(--ok-text); }
    .status-bar.err { background: var(--err-bg); color: var(--err-text); }
  </style>
</head>
<body>
  <div class="tabs">
    <button class="tab-btn active" data-tab="layout" onclick="switchTab('layout')">Layout</button>
    <button class="tab-btn" data-tab="color" onclick="switchTab('color')">Color</button>
  </div>

  <div class="content">
    <!-- LAYOUT TAB -->
    <div id="panel-layout" class="panel active">
      <div class="card">
        <div class="card-header">
          <span class="card-title">Precision Snap</span>
          <span class="hint">selected or all</span>
        </div>
        <div class="row">
          <label for="snap-unit">Unit</label>
          <select id="snap-unit" onchange="onUnitChange()">
            <option value="in" selected>in</option>
            <option value="cm">cm</option>
            <option value="pt">pt</option>
          </select>
          <label for="snap-decimals">Decimals</label>
          <select id="snap-decimals">
            <option value="0">0</option>
            <option value="1" selected>1</option>
            <option value="2">2</option>
          </select>
        </div>
        <div class="grid-2">
          <button class="btn" onclick="runSnap('position')">Position</button>
          <button class="btn" onclick="runSnap('dimension')">Dimension</button>
          <button class="btn" onclick="runSnap('rotation')">Rotation</button>
          <button class="btn" onclick="runSnap('zeroRotation')">Straighten (0°)</button>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Copy Attributes</span>
          <span class="hint">from last selected</span>
        </div>
        <div class="grid-2">
          <button class="btn" onclick="runCopy(true, false, false)">Width</button>
          <button class="btn" onclick="runCopy(false, true, false)">Height</button>
          <button class="btn" onclick="runCopy(true, true, false)">Width &amp; Height</button>
          <button class="btn" onclick="runCopy(false, false, true)">Rotation</button>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Adjoin</span>
          <span class="hint">anchor = last selected</span>
        </div>
        <div class="row">
          <label for="adjoin-padding">Gap</label>
          <input id="adjoin-padding" type="number" step="0.1" value="0">
          <span id="adjoin-unit-label" class="hint">in</span>
          <label class="checkbox-label" style="margin-left:auto;">
            <input id="adjoin-center" type="checkbox" checked> Center
          </label>
        </div>
        <div class="grid-2">
          <button class="btn" onclick="runAdjoin(true)">Horizontally</button>
          <button class="btn" onclick="runAdjoin(false)">Vertically</button>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Align</span>
          <span class="hint">to last selected / page</span>
        </div>
        <div class="segmented">
          <button id="edge-inner" class="active" onclick="setAlignEdge(false)">Inner edge</button>
          <button id="edge-outer" onclick="setAlignEdge(true)">Outer edge</button>
        </div>
        <div class="grid-3" style="margin-bottom:6px;">
          <button class="btn btn-sm" onclick="runAlign('LEFT', 'NOT_SET')">Left</button>
          <button id="align-hcenter" class="btn btn-sm" onclick="runAlign('CENTER', 'NOT_SET')">H-Center</button>
          <button class="btn btn-sm" onclick="runAlign('RIGHT', 'NOT_SET')">Right</button>
          <button class="btn btn-sm" onclick="runAlign('NOT_SET', 'TOP')">Top</button>
          <button id="align-vcenter" class="btn btn-sm" onclick="runAlign('NOT_SET', 'CENTER')">V-Center</button>
          <button class="btn btn-sm" onclick="runAlign('NOT_SET', 'BOTTOM')">Bottom</button>
        </div>
        <button class="btn" style="width:100%;" onclick="runAction('sidebarCenterOnPage', [])">Center on Page</button>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Flip Positions</span>
          <span class="hint">last 2 selected</span>
        </div>
        <div class="grid-3">
          <button class="btn btn-sm" onclick="runFlip(true, false)">Horizontal</button>
          <button class="btn btn-sm" onclick="runFlip(false, true)">Vertical</button>
          <button class="btn btn-sm" onclick="runFlip(true, true)">Both</button>
        </div>
      </div>
    </div>

    <!-- COLOR TAB -->
    <div id="panel-color" class="panel">
      <div class="card">
        <div class="card-header">
          <span class="card-title">Color Inspector</span>
          <button class="btn btn-sm" onclick="refreshInspector()">Inspect</button>
        </div>
        <div class="row">
          <div class="swatch-box">
            <div id="swatch-fill" class="swatch-fill"></div>
          </div>
          <div class="color-meta">
            <div id="color-hex" class="color-hex">—</div>
            <div id="color-details" class="color-details">Select a shape &amp; click Inspect</div>
            <div id="color-theme"></div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Quick Color Actions</span>
        </div>
        <div class="grid-3">
          <button class="btn btn-sm" onclick="runColorAction('swap')">Swap</button>
          <button class="btn btn-sm" onclick="runColorAction('invert')">Invert</button>
          <button class="btn btn-sm" onclick="runColorAction('maxContrast')">Max Contrast</button>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Hue</span>
        </div>
        <div class="grid-4" style="margin-bottom:6px;">
          <button class="btn btn-sm" onclick="runHsl('HUE', -30, false)">-30°</button>
          <button class="btn btn-sm" onclick="runHsl('HUE', -15, false)">-15°</button>
          <button class="btn btn-sm" onclick="runHsl('HUE', 15, false)">+15°</button>
          <button class="btn btn-sm" onclick="runHsl('HUE', 30, false)">+30°</button>
        </div>
        <div class="row">
          <input id="slider-hue" class="hue-slider" type="range" min="0" max="359" value="0"
            oninput="updateLabel('val-hue', this.value + '°')">
          <span id="val-hue" class="val-label">0°</span>
          <button class="btn btn-sm btn-primary" onclick="runHsl('HUE', Number(el('slider-hue').value), true)">Set</button>
        </div>
        <div id="hue-swatches" class="hue-swatches"></div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Saturation</span>
        </div>
        <div class="grid-6" style="margin-bottom:6px;">
          <button class="btn btn-sm" onclick="runHsl('SATURATION', -33, false)">-33</button>
          <button class="btn btn-sm" onclick="runHsl('SATURATION', -10, false)">-10</button>
          <button class="btn btn-sm" onclick="runHsl('SATURATION', -5, false)">-5</button>
          <button class="btn btn-sm" onclick="runHsl('SATURATION', 5, false)">+5</button>
          <button class="btn btn-sm" onclick="runHsl('SATURATION', 10, false)">+10</button>
          <button class="btn btn-sm" onclick="runHsl('SATURATION', 33, false)">+33</button>
        </div>
        <div class="row">
          <input id="slider-sat" type="range" min="0" max="100" value="50"
            oninput="updateLabel('val-sat', this.value + '%')">
          <span id="val-sat" class="val-label">50%</span>
          <button class="btn btn-sm btn-primary" onclick="runHsl('SATURATION', Number(el('slider-sat').value), true)">Set</button>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Luminosity</span>
        </div>
        <div class="grid-6" style="margin-bottom:6px;">
          <button class="btn btn-sm" onclick="runHsl('LUMINOSITY', -33, false)">-33</button>
          <button class="btn btn-sm" onclick="runHsl('LUMINOSITY', -10, false)">-10</button>
          <button class="btn btn-sm" onclick="runHsl('LUMINOSITY', -5, false)">-5</button>
          <button class="btn btn-sm" onclick="runHsl('LUMINOSITY', 5, false)">+5</button>
          <button class="btn btn-sm" onclick="runHsl('LUMINOSITY', 10, false)">+10</button>
          <button class="btn btn-sm" onclick="runHsl('LUMINOSITY', 33, false)">+33</button>
        </div>
        <div class="row">
          <input id="slider-lum" type="range" min="0" max="100" value="50"
            oninput="updateLabel('val-lum', this.value + '%')">
          <span id="val-lum" class="val-label">50%</span>
          <button class="btn btn-sm btn-primary" onclick="runHsl('LUMINOSITY', Number(el('slider-lum').value), true)">Set</button>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Transparency</span>
        </div>
        <div class="row">
          <input id="slider-trans" type="range" min="0" max="100" value="0"
            oninput="updateLabel('val-trans', this.value + '%')">
          <span id="val-trans" class="val-label">0%</span>
          <button class="btn btn-sm btn-primary" onclick="runTransparency(Number(el('slider-trans').value))">Set</button>
        </div>
        <div class="grid-4" style="margin-top:6px;">
          <button class="btn btn-sm" onclick="runTransparency(0)">0%</button>
          <button class="btn btn-sm" onclick="runTransparency(25)">25%</button>
          <button class="btn btn-sm" onclick="runTransparency(50)">50%</button>
          <button class="btn btn-sm" onclick="runTransparency(75)">75%</button>
        </div>
      </div>
    </div>
  </div>

  <div id="status-bar" class="status-bar">Ready</div>

  <script>
    let isOuterEdge = false;
    let busy = false;

    function el(id) {
      return document.getElementById(id);
    }

    function updateLabel(id, text) {
      el(id).textContent = text;
    }

    function setStatus(message, kind) {
      const bar = el('status-bar');
      bar.textContent = message;
      bar.className = 'status-bar' + (kind ? ' ' + kind : '');
    }

    function setBusy(state) {
      busy = state;
      const buttons = document.querySelectorAll('button.btn, button.hue-dot');
      buttons.forEach((b) => {
        if (b.id === 'align-hcenter' || b.id === 'align-vcenter') {
          b.disabled = state || isOuterEdge;
        } else {
          b.disabled = state;
        }
      });
      if (state) setStatus('Working...', '');
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach((b) => {
        b.classList.toggle('active', b.dataset.tab === tab);
      });
      document.querySelectorAll('.panel').forEach((p) => {
        p.classList.toggle('active', p.id === 'panel-' + tab);
      });
    }

    function onUnitChange() {
      const unit = el('snap-unit').value;
      el('adjoin-unit-label').textContent = unit;
      if (unit === 'pt') el('snap-decimals').value = '0';
    }

    function setAlignEdge(outer) {
      isOuterEdge = outer;
      el('edge-inner').classList.toggle('active', !outer);
      el('edge-outer').classList.toggle('active', outer);
      el('align-hcenter').disabled = busy || outer;
      el('align-vcenter').disabled = busy || outer;
    }

    function renderInspector(data) {
      if (!data) return;
      const rgba = 'rgba(' + data.rgb[0] + ',' + data.rgb[1] + ',' + data.rgb[2] + ',' + data.alpha + ')';
      el('swatch-fill').style.backgroundColor = rgba;
      el('color-hex').textContent = data.hex.toUpperCase() + '  (' + data.transparencyPct + '% transparent)';
      el('color-details').textContent =
        'RGB ' + data.rgb.join(', ') +
        ' | HSL ' + data.hsl[0] + '°, ' + data.hsl[1] + '%, ' + data.hsl[2] + '%' +
        ' | LCH ' + data.lch[0] + '%, ' + data.lch[1] + ', ' + data.lch[2] + '°';

      const themeEl = el('color-theme');
      themeEl.innerHTML = '';
      if (data.themeColorType) {
        const badge = document.createElement('span');
        badge.className = 'theme-badge';
        badge.textContent = 'Theme: ' + data.themeColorType;
        themeEl.appendChild(badge);
      }

      // Sync sliders to current shape color
      const hue = Math.round(data.hsl[0]) % 360;
      const sat = Math.round(data.hsl[1]);
      const lum = Math.round(data.hsl[2]);
      const trans = Math.round(data.transparencyPct);

      el('slider-hue').value = String(hue);
      updateLabel('val-hue', hue + '°');
      el('slider-sat').value = String(sat);
      updateLabel('val-sat', sat + '%');
      el('slider-lum').value = String(lum);
      updateLabel('val-lum', lum + '%');
      el('slider-trans').value = String(trans);
      updateLabel('val-trans', trans + '%');
    }

    function runAction(fnName, args, onDone) {
      if (busy) return;
      setBusy(true);
      google.script.run
        .withSuccessHandler((res) => {
          setBusy(false);
          if (!res) {
            setStatus('Done', 'ok');
            return;
          }
          if (res.ok) {
            if (res.inspected) renderInspector(res.inspected);
            if (onDone) onDone(res);
            setStatus(res.message || 'Done', 'ok');
          } else {
            setStatus(res.error || 'Action could not be completed.', 'err');
          }
        })
        .withFailureHandler((err) => {
          setBusy(false);
          setStatus('Error: ' + (err && err.message ? err.message : String(err)), 'err');
        })[fnName].apply(null, args);
    }

    function runSnap(mode) {
      const unit = el('snap-unit').value;
      const decimals = Number(el('snap-decimals').value);
      runAction('sidebarSnap', [mode, unit, decimals]);
    }

    function runCopy(w, h, r) {
      runAction('sidebarCopyAttributes', [w, h, r]);
    }

    function runAdjoin(horizontal) {
      const padding = parseFloat(el('adjoin-padding').value) || 0;
      const unit = el('snap-unit').value;
      const center = el('adjoin-center').checked;
      runAction('sidebarAdjoin', [horizontal, padding, unit, center]);
    }

    function runAlign(posX, posY) {
      runAction('sidebarAlign', [posX, posY, isOuterEdge]);
    }

    function runFlip(flipH, flipV) {
      runAction('sidebarFlip', [flipH, flipV]);
    }

    function refreshInspector() {
      runAction('sidebarInspectColor', [], (res) => {
        renderInspector(res.data);
        setStatus(
          res.data.selectedCount > 1
            ? 'Inspected last of ' + res.data.selectedCount + ' selected shapes.'
            : 'Inspected shape color.',
          'ok'
        );
      });
    }

    function runColorAction(action) {
      runAction('sidebarColorAction', [action]);
    }

    function runHsl(component, value, isAbsolute) {
      runAction('sidebarAdjustHsl', [component, value, isAbsolute]);
    }

    function runTransparency(pct) {
      runAction('sidebarSetTransparency', [pct]);
    }

    // Build 12 quick hue swatches (0° .. 330°)
    (function initHueSwatches() {
      const container = el('hue-swatches');
      for (let deg = 0; deg < 360; deg += 30) {
        const btn = document.createElement('button');
        btn.className = 'hue-dot';
        btn.title = deg + '°';
        btn.style.backgroundColor = 'hsl(' + deg + ', 90%, 50%)';
        btn.onclick = () => runHsl('HUE', deg, true);
        container.appendChild(btn);
      }
    })();
  </script>
</body>
</html>
